<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marte – Cráter Jezero</title>
    <!-- Favicon inline para evitar el error 404 de /favicon.ico -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23c1440e'/></svg>" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #c98a55; }
      canvas { display: block; }
      #ayuda {
        position: fixed; left: 16px; bottom: 16px; padding: 8px 12px;
        font: 14px system-ui, sans-serif; color: #fff3e6;
        background: rgba(60, 25, 10, 0.45); border-radius: 8px; pointer-events: none;
      }

      /* --- Control de misión: consola de la sala de control sobre el juego --- */
      #control-mision {
        --cm-fondo: rgba(22, 12, 8, 0.8);
        --cm-borde: rgba(255, 190, 140, 0.22);
        --cm-texto: #fbeee4;
        --cm-tenue: #d2b3a0;
        --cm-acento: #ffb36b;     /* naranja de pantalla de control */
        --cm-vivo: #7fe3c4;       /* verde de enlace activo */
        --cm-rejilla: rgba(255, 210, 170, 0.12);
        position: fixed; top: 16px; right: 16px;
        width: min(330px, calc(100vw - 32px)); max-height: calc(100% - 32px); overflow-y: auto;
        box-sizing: border-box; padding: 12px 14px;
        background: var(--cm-fondo); color: var(--cm-texto);
        border: 1px solid var(--cm-borde); border-radius: 10px;
        font: 13px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace;
        display: grid; gap: 8px;
      }
      #control-mision[hidden] { display: none; }
      #control-mision header { display: flex; justify-content: space-between; align-items: center; gap: 8px;
        font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cm-tenue); }
      #control-mision .enlace { display: flex; align-items: center; gap: 6px; color: var(--cm-vivo); }
      #control-mision .enlace i { width: 7px; height: 7px; border-radius: 50%; background: var(--cm-vivo);
        animation: latido 1.6s ease-in-out infinite; }
      @keyframes latido { 50% { opacity: 0.25; } }
      @media (prefers-reduced-motion: reduce) { #control-mision .enlace i { animation: none; } }
      #control-mision h2 { margin: 0; font: 600 18px/1.2 system-ui, sans-serif; letter-spacing: 0.02em; }
      #control-mision .tarjetas { display: grid; gap: 8px; }
      #control-mision .tarjeta { display: grid; gap: 2px; padding-top: 8px; border-top: 1px solid var(--cm-borde); }
      #control-mision .fila { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      #control-mision h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
      #control-mision .fuente { font-size: 10px; color: var(--cm-tenue); border: 1px solid var(--cm-borde);
        border-radius: 4px; padding: 0 5px; }
      #control-mision .valor { display: flex; align-items: baseline; gap: 6px; }
      #control-mision .valor b { font-size: 20px; font-weight: 600; color: var(--cm-acento);
        font-variant-numeric: tabular-nums; }
      #control-mision .valor span { color: var(--cm-tenue); }
      #control-mision canvas { width: 100%; height: 34px; }
      #control-mision .ejes { display: flex; justify-content: space-between; font-size: 10px; color: var(--cm-tenue); }
      #control-mision .frase { margin: 0; font: 12px/1.35 system-ui, sans-serif; color: var(--cm-texto); }
      #control-mision footer { font-size: 10px; color: var(--cm-tenue); }
      #control-mision kbd { border: 1px solid var(--cm-borde); border-radius: 3px; padding: 0 4px; }

      /* --- Puntos de las cámaras sobre el rover --- */
      #puntos-camara { position: fixed; inset: 0; pointer-events: none; }
      .punto-camara {
        position: absolute; left: -11px; top: -11px; width: 22px; height: 22px; padding: 0;
        border: 0; background: none; cursor: pointer; pointer-events: auto;
      }
      .punto-camara[hidden] { display: none; }
      .punto-camara .brillo {
        position: absolute; inset: 5px; border-radius: 50%;
        background: #fff6d8; box-shadow: 0 0 6px 2px #ffd36b, 0 0 16px 6px rgba(255, 170, 60, 0.55);
        animation: brillar 1.8s ease-in-out infinite;
      }
      @keyframes brillar { 50% { transform: scale(1.35); box-shadow: 0 0 10px 4px #ffd36b, 0 0 26px 10px rgba(255, 170, 60, 0.35); } }
      @media (prefers-reduced-motion: reduce) { .punto-camara .brillo { animation: none; } }
      .punto-camara .etiqueta {
        position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%);
        white-space: nowrap; padding: 6px 10px; border-radius: 6px;
        background: rgba(22, 12, 8, 0.88); color: #fbeee4; border: 1px solid rgba(255, 190, 140, 0.3);
        font: 12px/1.35 system-ui, sans-serif; text-align: left;
        opacity: 0; translate: 0 4px; transition: opacity 0.15s, translate 0.15s; pointer-events: none;
      }
      .punto-camara .etiqueta b { display: block; font: 600 12px ui-monospace, Consolas, monospace;
        letter-spacing: 0.08em; text-transform: uppercase; color: #ffb36b; }
      .punto-camara:hover .etiqueta, .punto-camara:focus-visible .etiqueta { opacity: 1; translate: 0 0; }
      .punto-camara:focus-visible { outline: 2px solid #ffb36b; outline-offset: 2px; border-radius: 50%; }

      /* --- Visor de fotos --- */
      #visor-fotos {
        position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; align-content: center; gap: 12px;
        background: rgba(10, 5, 3, 0.86); color: #fbeee4; font: 14px/1.4 system-ui, sans-serif;
        padding: 24px 16px;
      }
      #visor-fotos[hidden] { display: none; }
      #visor-fotos figure { margin: 0; display: grid; gap: 10px; justify-items: center; max-width: min(1100px, 92vw); }
      #visor-fotos .marco { position: relative; cursor: zoom-in; overflow: hidden; border-radius: 4px;
        box-shadow: 0 10px 50px rgba(0, 0, 0, 0.6); background: #000; }
      #visor-fotos img { display: block; max-width: min(1100px, 92vw); max-height: 72vh; object-fit: contain;
        clip-path: inset(0 0 100% 0); filter: blur(18px) saturate(0.2) brightness(1.4); }
      /* Se revela como si llegara por radio: de arriba hacia abajo, en franjas, y luego se enfoca */
      #visor-fotos .marco.revelando img {
        animation: llegar 2.4s steps(30, end) forwards, enfocar 1.6s ease-out 1.6s forwards;
      }
      #visor-fotos .marco.revelada img { clip-path: inset(0); filter: none; animation: none; }
      @keyframes llegar { to { clip-path: inset(0 0 0 0); } }
      @keyframes enfocar { to { filter: blur(0) saturate(1) brightness(1); } }
      #visor-fotos figcaption { display: grid; gap: 2px; justify-items: center; text-align: center; }
      #visor-fotos .linea1 { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px;
        font: 600 14px ui-monospace, Consolas, monospace; letter-spacing: 0.06em; text-transform: uppercase; }
      #visor-fotos .cam { color: #ffb36b; }
      #visor-fotos .titulo { color: #e8d3c4; max-width: 70ch; }
      #visor-fotos .recibiendo { font: 12px ui-monospace, Consolas, monospace; color: #7fe3c4; }
      #visor-fotos .ayuda-visor { font-size: 12px; color: #c9ad9b; text-align: center; }
      #visor-fotos kbd { border: 1px solid rgba(255, 190, 140, 0.35); border-radius: 3px; padding: 0 4px; font-size: 11px; }
      /* Ampliada: la foto ocupa toda la pantalla */
      #visor-fotos.ampliada { padding: 8px; }
      #visor-fotos.ampliada figcaption, #visor-fotos.ampliada .ayuda-visor { display: none; }
      #visor-fotos.ampliada figure { max-width: 100vw; }
      #visor-fotos.ampliada .marco { cursor: zoom-out; }
      #visor-fotos.ampliada img { max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); }
      /* Obturador (dos hojas que se cierran y abren) y flash */
      #visor-fotos .obturador { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
      #visor-fotos .obturador i { position: absolute; left: 0; right: 0; height: 50%; background: #000; transform: scaleY(0); }
      #visor-fotos .obturador i:first-child { top: 0; transform-origin: top; }
      #visor-fotos .obturador i:last-child { bottom: 0; transform-origin: bottom; }
      #visor-fotos .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 3; }
      #visor-fotos.disparo .obturador i { animation: cerrar 0.28s ease-in-out; }
      #visor-fotos.disparo .flash { animation: flash 0.7s ease-out 0.14s; }
      @keyframes cerrar { 50% { transform: scaleY(1); } }
      @keyframes flash { 0% { opacity: 0.95; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #visor-fotos .marco.revelando img { animation-duration: 0.01s; }
        #visor-fotos.disparo .obturador i, #visor-fotos.disparo .flash { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="ayuda">W A S D o flechas para manejar · mouse para mirar · T control de misión · clic en los puntos brillantes para tomar fotos</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
